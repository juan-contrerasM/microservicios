spring.application.name=Reto1
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:hr_management}
spring.datasource.username=${DB_USER:empleados}
spring.datasource.password=${DB_PASSWORD:empleados}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Para devolver 404 en rutas/métodos no definidos
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
