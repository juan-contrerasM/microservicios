spring.application.name=Reto1
server.port=8080

# Versión del artefacto: Maven la toma de <version> del pom al filtrar este archivo.
# Es la que lleva el OpenAPI exportado (openapi.yaml), así el archivo no depende del
# entorno. GET /health publica service.version (contrato C2), que por defecto es la
# misma y SERVICE_VERSION permite sobrescribir con el tag de la imagen desplegada.
service.artifact-version=@project.version@
service.version=${SERVICE_VERSION:${service.artifact-version}}
# Tiempo máximo total de los checks de /health: responde en < 3 s aunque una
# dependencia cuelgue (Fase 5, contrato C2).
health.check-timeout-ms=${HEALTH_CHECK_TIMEOUT_MS:2000}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:hr_management}
spring.datasource.username=${DB_USER:empleados}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Con PostgreSQL caído una petición espera como máximo esto por una conexión del
# pool (Hikari usa 30 s por defecto) y luego responde 503 (contrato C3).
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Liquibase es la única fuente de verdad del esquema
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Cliente HTTP de departamentos
departamentos.service.url=${DEPARTAMENTOS_SERVICE_URL:http://localhost:8081}
departamentos.service.timeout=${DEPARTAMENTOS_SERVICE_TIMEOUT:5s}
departamentos.service.max-attempts=${DEPARTAMENTOS_SERVICE_MAX_ATTEMPTS:4}
departamentos.service.initial-backoff=${DEPARTAMENTOS_SERVICE_INITIAL_BACKOFF:1s}

# Circuit Breaker (Resilience4j) sobre la llamada a departamentos (Reto 3, Etapa 3).
# Un 404 (BadRequestException) es respuesta válida del proveedor y cuenta como
# éxito del circuito; solo ServiceUnavailableException (reintentos agotados, timeout,
# conexión rechazada, 5xx) se configura como fallo.
resilience4j.circuitbreaker.instances.departamentos.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.departamentos.sliding-window-size=${CB_SLIDING_WINDOW_SIZE:3}
resilience4j.circuitbreaker.instances.departamentos.minimum-number-of-calls=${CB_MINIMUM_NUMBER_OF_CALLS:3}
resilience4j.circuitbreaker.instances.departamentos.failure-rate-threshold=${CB_FAILURE_RATE_THRESHOLD:100}
resilience4j.circuitbreaker.instances.departamentos.wait-duration-in-open-state=${CB_WAIT_DURATION_OPEN:30s}
resilience4j.circuitbreaker.instances.departamentos.permitted-number-of-calls-in-half-open-state=${CB_PERMITTED_CALLS_HALF_OPEN:1}
resilience4j.circuitbreaker.instances.departamentos.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.departamentos.record-exceptions=com.microservicios.Reto1.exception.ServiceUnavailableException

# Para devolver 404 en rutas/métodos no definidos
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# OpenAPI / Swagger UI (Etapa 4). Springdoc registra sus propios resource
# handlers, así que no hace falta habilitar el mapeo estático global.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.packages-to-scan=com.microservicios.Reto1.controller
# Claves ordenadas: el YAML generado es determinista y se puede comparar con el
# openapi.yaml versionado (OpenApiContratoTest).
springdoc.writer-with-order-by-keys=true

# Broker (Reto 4). La URL no lleva credenciales: usuario y contraseña van aparte.
# Dentro de Compose, BROKER_URL=amqp://message-broker:5672. En local, el puerto 5672 del host.
broker.url=${BROKER_URL:amqp://localhost:5672}
broker.username=${RABBITMQ_USER:onboarding}
broker.password=${RABBITMQ_PASSWORD}
broker.exchange=${BROKER_EXCHANGE:onboarding.eventos}
broker.connection-timeout-ms=${BROKER_CONNECTION_TIMEOUT_MS:3000}

# Reto 8: métricas Prometheus y logs JSON correlacionables con OpenTelemetry.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.service=empleados-service
# Reto 8: buckets de histograma para calcular p95 en Prometheus (job:http_request_duration_seconds:p95_5m).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
logging.structured.format.console=logstash
# Fase 11 (contrato C5): mismos nombres de campo que el resto de servicios. Los corchetes
# conservan las claves con @ y _ (sin ellos Spring las normaliza al enlazar el mapa).
logging.structured.json.rename[@timestamp]=timestamp
logging.structured.json.rename[trace_id]=traceId
logging.structured.json.rename[span_id]=spanId
logging.structured.json.exclude=@version,level_value,trace_flags
logging.structured.json.add.service=${OTEL_SERVICE_NAME:empleados-service}
