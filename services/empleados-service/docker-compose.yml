services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hr_management
      POSTGRES_USER: empleados
      POSTGRES_PASSWORD: empleados
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empleados -d hr_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: servidor-empleados
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: hr_management
      DB_USER: empleados
      DB_PASSWORD: empleados
      DEPARTAMENTOS_SERVICE_URL: ${DEPARTAMENTOS_SERVICE_URL:-http://host.docker.internal:8081}
      DEPARTAMENTOS_SERVICE_TIMEOUT: ${DEPARTAMENTOS_SERVICE_TIMEOUT:-3s}
      DEPARTAMENTOS_SERVICE_MAX_ATTEMPTS: ${DEPARTAMENTOS_SERVICE_MAX_ATTEMPTS:-4}
      DEPARTAMENTOS_SERVICE_INITIAL_BACKOFF: ${DEPARTAMENTOS_SERVICE_INITIAL_BACKOFF:-1s}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  pgdata:
