[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
addopts = [
    "--junitxml=reports/junit.xml",
    "--cov=auth_service",
    "--cov-report=xml:reports/coverage.xml",
    "--cov-report=term-missing",
    # Fase 8 (E16): la suite falla si la cobertura baja del 70 %.
    "--cov-fail-under=70",
]

[tool.coverage.run]
branch = true
