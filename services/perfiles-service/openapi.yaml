openapi: 3.1.0
info:
  description: |
    Perfil replicado por eventos. empleado.creado inserta el perfil,
    empleado.actualizado copia los datos del empleado, empleado.retirado
    pone archivado en true. PUT solo edita los campos personales
    (telefono, direccion, ciudad, codigoPostal, biografia, fotoUrl y
    redesSociales) y no publica eventos. Un perfil ausente responde 404.

    Todos los errores usan el formato uniforme ApiError (contrato C3).
    401 y 403 los emite el API Gateway: 401 sin token o token inválido,
    403 cuando un USER edita un perfil ajeno. 503 indica que PostgreSQL
    no está disponible. GET /health es público (contrato C2) y revisa
    PostgreSQL y RabbitMQ.
  title: perfiles-service
  version: 0.0.1-SNAPSHOT
servers:
- description: Mismo origen que sirve la documentación
  url: /
tags:
- description: Health check real contra PostgreSQL y RabbitMQ (contrato C2)
  name: Salud
- description: Perfil de empleado replicado por eventos
  name: Perfiles
paths:
  /health:
    get:
      description: "Verifica PostgreSQL (database) y RabbitMQ (messageBroker) con\
        \ un tiempo máximo de 2 s en total: responde en menos de 3 s aunque una dependencia\
        \ cuelgue. No requiere JWT; Docker Compose lo usa como healthcheck del contenedor."
      operationId: health
      responses:
        "200":
          content:
            application/json:
              example:
                status: UP
                service: perfiles-service
                version: 0.0.1-SNAPSHOT
                checks:
                  database: UP
                  messageBroker: UP
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: Todas las dependencias están UP
        "503":
          content:
            application/json:
              example:
                status: DOWN
                service: perfiles-service
                version: 0.0.1-SNAPSHOT
                checks:
                  database: DOWN
                  messageBroker: UP
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: Alguna dependencia está DOWN o no respondió a tiempo
      summary: Health check
      tags:
      - Salud
  /perfiles:
    get:
      description: "Devuelve todos los perfiles, incluidos los archivados (empleados\
        \ retirados)."
      operationId: listar
      responses:
        "200":
          content:
            application/json:
              example:
              - id: 0b8f6a52-3c1e-4c1f-9a51-1f7c2d9e4a10
                empleadoId: E001
                nombre: Juan
                apellido: Pérez
                email: juan.perez@empresa.com
                telefono: +57 300 000 0000
                direccion: "Calle 10 # 20-30"
                ciudad: Bogotá
                codigoPostal: "110111"
                cargo: Desarrollador Senior
                area: Tecnología
                numeroEmpleado: EMP-2026-001
                fotoUrl: https://example.com/fotos/E001.png
                redesSociales: "{\"linkedin\":\"https://linkedin.com/in/juanperez\"\
                  }"
                biografia: Desarrollador backend.
                fechaCreacion: 2026-11-09T12:00:00Z
                archivado: false
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Perfil"
          description: Listado de perfiles
        "401":
          content:
            application/json:
              example:
                error: Unauthorized
                message: No autenticado
                path: /perfiles
                status: 401
                timestamp: 2026-11-09T12:00:00Z
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Sin token, token inválido o expirado (lo responde el API Gateway)"
        "500":
          content:
            application/json:
              example:
                error: Internal Server Error
                message: Error interno del servidor
                path: /perfiles
                status: 500
                timestamp: 2026-11-09T12:00:00Z
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Error inesperado, sin detalles internos"
        "503":
          content:
            application/json:
              example:
                error: Service Unavailable
                message: La base de datos no está disponible
                path: /perfiles
                status: 503
                timestamp: 2026-11-09T12:00:00Z
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
              schema:
                $ref: "#/components/schemas/ApiError"
          description: PostgreSQL no está disponible
      security:
      - bearerAuth: []
      summary: Listar perfiles
      tags:
      - Perfiles
  /perfiles/{empleadoId}:
    get:
      description: Un perfil archivado (empleado retirado) sigue respondiendo 200
        con archivado=true.
      operationId: obtener
      parameters:
      - description: Id del empleado dueño del perfil
        example: E001
        in: path
        name: empleadoId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                id: 0b8f6a52-3c1e-4c1f-9a51-1f7c2d9e4a10
                empleadoId: E001
                nombre: Juan
                apellido: Pérez
                email: juan.perez@empresa.com
                telefono: +57 300 000 0000
                direccion: "Calle 10 # 20-30"
                ciudad: Bogotá
                codigoPostal: "110111"
                cargo: Desarrollador Senior
                area: Tecnología
                numeroEmpleado: EMP-2026-001
                fotoUrl: https://example.com/fotos/E001.png
                redesSociales: "{\"linkedin\":\"https://linkedin.com/in/juanperez\"\
                  }"
                biografia: Desarrollador backend.
                fechaCreacion: 2026-11-09T12:00:00Z
                archivado: false
              schema:
                $ref: "#/components/schemas/Perfil"
          description: Perfil encontrado
        "401":
          content:
            application/json:
              example:
                error: Unauthorized
                message: No autenticado
                path: "/perfiles/{empleadoId}"
                status: 401
                timestamp: 2026-11-09T12:00:00Z
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Sin token, token inválido o expirado (lo responde el API Gateway)"
        "404":
          content:
            application/json:
              example:
                timestamp: 2026-11-09T12:00:00Z
                status: 404
                error: Not Found
                message: El perfil del empleado E999 no existe
                path: /perfiles/E999
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
              schema:
                $ref: "#/components/schemas/ApiError"
          description: No hay perfil para ese empleado
        "500":
          content:
            application/json:
              example:
                error: Internal Server Error
                message: Error interno del servidor
                path: "/perfiles/{empleadoId}"
                status: 500
                timestamp: 2026-11-09T12:00:00Z
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Error inesperado, sin detalles internos"
        "503":
          content:
            application/json:
              example:
                error: Service Unavailable
                message: La base de datos no está disponible
                path: "/perfiles/{empleadoId}"
                status: 503
                timestamp: 2026-11-09T12:00:00Z
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
              schema:
                $ref: "#/components/schemas/ApiError"
          description: PostgreSQL no está disponible
      security:
      - bearerAuth: []
      summary: Obtener el perfil de un empleado
      tags:
      - Perfiles
    put:
      description: "Edita telefono, direccion, ciudad, codigoPostal, biografia, fotoUrl\
        \ y redesSociales. Un campo ausente no se borra. No publica eventos. Un ADMIN\
        \ edita cualquier perfil; un USER solo el suyo (el Gateway compara el empleadoId\
        \ con el sub del token)."
      operationId: actualizar
      parameters:
      - description: Id del empleado dueño del perfil
        example: E001
        in: path
        name: empleadoId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              telefono: +57 300 000 0000
              direccion: "Calle 10 # 20-30"
              ciudad: Bogotá
              codigoPostal: "110111"
              biografia: Desarrollador backend.
              fotoUrl: https://example.com/fotos/E001.png
              redesSociales: "{\"linkedin\":\"https://linkedin.com/in/juanperez\"}"
            schema:
              $ref: "#/components/schemas/ActualizarPerfilRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                id: 0b8f6a52-3c1e-4c1f-9a51-1f7c2d9e4a10
                empleadoId: E001
                nombre: Juan
                apellido: Pérez
                email: juan.perez@empresa.com
                telefono: +57 300 000 0000
                direccion: "Calle 10 # 20-30"
                ciudad: Bogotá
                codigoPostal: "110111"
                cargo: Desarrollador Senior
                area: Tecnología
                numeroEmpleado: EMP-2026-001
                fotoUrl: https://example.com/fotos/E001.png
                redesSociales: "{\"linkedin\":\"https://linkedin.com/in/juanperez\"\
                  }"
                biografia: Desarrollador backend.
                fechaCreacion: 2026-11-09T12:00:00Z
                archivado: false
              schema:
                $ref: "#/components/schemas/Perfil"
          description: Perfil actualizado
        "400":
          content:
            application/json:
              example:
                timestamp: 2026-11-09T12:00:00Z
                status: 400
                error: Bad Request
                message: El cuerpo de la solicitud es inválido o está mal formado
                path: /perfiles/E001
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
              schema:
                $ref: "#/components/schemas/ApiError"
          description: JSON mal formado
        "401":
          content:
            application/json:
              example:
                error: Unauthorized
                message: No autenticado
                path: "/perfiles/{empleadoId}"
                status: 401
                timestamp: 2026-11-09T12:00:00Z
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Sin token, token inválido o expirado (lo responde el API Gateway)"
        "403":
          content:
            application/json:
              example:
                timestamp: 2026-11-09T12:00:00Z
                status: 403
                error: Forbidden
                message: No tiene permisos para realizar esta operación
                path: /perfiles/E002
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Un USER intenta editar un perfil ajeno (lo responde el API
            Gateway)
        "404":
          content:
            application/json:
              example:
                timestamp: 2026-11-09T12:00:00Z
                status: 404
                error: Not Found
                message: El perfil del empleado E999 no existe
                path: /perfiles/E999
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
              schema:
                $ref: "#/components/schemas/ApiError"
          description: No hay perfil para ese empleado
        "500":
          content:
            application/json:
              example:
                error: Internal Server Error
                message: Error interno del servidor
                path: "/perfiles/{empleadoId}"
                status: 500
                timestamp: 2026-11-09T12:00:00Z
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Error inesperado, sin detalles internos"
        "503":
          content:
            application/json:
              example:
                error: Service Unavailable
                message: La base de datos no está disponible
                path: "/perfiles/{empleadoId}"
                status: 503
                timestamp: 2026-11-09T12:00:00Z
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
              schema:
                $ref: "#/components/schemas/ApiError"
          description: PostgreSQL no está disponible
      security:
      - bearerAuth: []
      summary: Editar el perfil
      tags:
      - Perfiles
components:
  schemas:
    ActualizarPerfilRequest:
      type: object
      properties:
        biografia:
          type: string
        ciudad:
          type: string
        codigoPostal:
          type: string
        direccion:
          type: string
        fotoUrl:
          type: string
        redesSociales:
          type: string
        telefono:
          type: string
    ApiError:
      type: object
      description: Error HTTP uniforme (contrato C3). Sin trazas de pila ni detalles
        internos.
      properties:
        error:
          type: string
          description: Frase estándar del código HTTP
          example: Not Found
        message:
          type: string
          description: Mensaje legible para el cliente
          example: El perfil del empleado E999 no existe
        path:
          type: string
          description: Ruta de la petición
          example: /perfiles/E999
        status:
          type: integer
          format: int32
          description: Código HTTP
          example: 404
        timestamp:
          type: string
          description: Instante UTC del error (ISO-8601)
          example: 2026-11-09T12:00:00Z
        traceId:
          type: string
          description: Trace id de OpenTelemetry (32 hex). Se omite si la petición
            no trae contexto de traza.
          example: 4bf92f3577b34da6a3ce929d0e0e4736
      required:
      - error
      - message
      - path
      - status
      - timestamp
    HealthResponse:
      type: object
      description: Estado de salud (contrato C2). UP solo si todas las dependencias
        reales están UP.
      properties:
        checks:
          type: object
          additionalProperties:
            type: string
          description: "Estado de cada dependencia: database (PostgreSQL) y messageBroker\
            \ (RabbitMQ)"
          example:
            database: UP
            messageBroker: UP
        service:
          type: string
          description: Nombre del servicio
          example: perfiles-service
        status:
          type: string
          description: UP o DOWN
          enum:
          - UP
          - DOWN
          example: UP
        version:
          type: string
          description: Versión del artefacto desplegado
          example: 0.0.1-SNAPSHOT
      required:
      - checks
      - service
      - status
      - version
    Perfil:
      type: object
      properties:
        apellido:
          type: string
        archivado:
          type: boolean
        area:
          type: string
        biografia:
          type: string
        cargo:
          type: string
        ciudad:
          type: string
        codigoPostal:
          type: string
        direccion:
          type: string
        email:
          type: string
        empleadoId:
          type: string
        fechaCreacion:
          type: string
          format: date-time
        fotoUrl:
          type: string
        id:
          type: string
        nombre:
          type: string
        numeroEmpleado:
          type: string
        redesSociales:
          type: string
        telefono:
          type: string
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Access JWT emitido por auth-service y validado por el API Gateway
      scheme: bearer
      type: http
