spring.application.name=perfiles-service
server.port=${PORT:8083}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:perfiles_db}
spring.datasource.username=${DB_USER:perfiles}
spring.datasource.password=${DB_PASSWORD:perfiles}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.microservicios.perfiles.controller

broker.url=${BROKER_URL:amqp://localhost:5672}
broker.username=${RABBITMQ_USER:onboarding}
broker.password=${RABBITMQ_PASSWORD:onboarding}
broker.exchange=${BROKER_EXCHANGE:onboarding.eventos}
broker.queue=${BROKER_QUEUE:q.perfiles}
broker.connection-timeout-ms=${BROKER_CONNECTION_TIMEOUT_MS:3000}

spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
