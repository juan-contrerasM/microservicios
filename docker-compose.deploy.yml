# Fase 10: despliegue desde el Registry local (localhost:5001) por tag inmutable.
#
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --no-build --no-deps <servicio>
#
# Lo usa scripts/deploy.sh (despliegue, smoke test y rollback). Cada servicio toma su imagen de
# REGISTRY/<servicio>:<TAG>; el tag por defecto es `latest`, pero el despliegue real fija el tag
# inmutable <commit>-<build> que publicó Jenkins. Las rutas de los bind mounts admiten HOST_REPO para
# que Jenkins (que corre en un contenedor) pueda desplegar con las rutas que ve el daemon del host.
services:
  empleados-service:
    image: ${REGISTRY:-localhost:5001}/empleados-service:${EMPLEADOS_TAG:-latest}
    pull_policy: always
  departamentos-service:
    image: ${REGISTRY:-localhost:5001}/departamentos-service:${DEPARTAMENTOS_TAG:-latest}
    pull_policy: always
  auth-service:
    image: ${REGISTRY:-localhost:5001}/auth-service:${AUTH_TAG:-latest}
    pull_policy: always
  perfiles-service:
    image: ${REGISTRY:-localhost:5001}/perfiles-service:${PERFILES_TAG:-latest}
    pull_policy: always
  vacaciones-service:
    image: ${REGISTRY:-localhost:5001}/vacaciones-service:${VACACIONES_TAG:-latest}
    pull_policy: always
  notificaciones-service:
    image: ${REGISTRY:-localhost:5001}/notificaciones-service:${NOTIFICACIONES_TAG:-latest}
    pull_policy: always
  api-gateway:
    image: ${REGISTRY:-localhost:5001}/api-gateway:${API_GATEWAY_TAG:-latest}
    pull_policy: always
  notificaciones-service:
    volumes: !override
      - ${HOST_REPO:-.}/services/notificaciones-service/config/templates.json:/app/config/templates.json:ro

secrets:
  empleados_db_password:
    file: ${HOST_REPO:-.}/secrets/empleados_db_password.txt
  departamentos_db_password:
    file: ${HOST_REPO:-.}/secrets/departamentos_db_password.txt
  departamentos_db_root_password:
    file: ${HOST_REPO:-.}/secrets/departamentos_db_root_password.txt
  rabbitmq_password:
    file: ${HOST_REPO:-.}/secrets/rabbitmq_password.txt
  notificaciones_db_password:
    file: ${HOST_REPO:-.}/secrets/notificaciones_db_password.txt
  perfiles_db_password:
    file: ${HOST_REPO:-.}/secrets/perfiles_db_password.txt
  vacaciones_db_password:
    file: ${HOST_REPO:-.}/secrets/vacaciones_db_password.txt
  auth_db_password:
    file: ${HOST_REPO:-.}/secrets/auth_db_password.txt
  jwt_secret:
    file: ${HOST_REPO:-.}/secrets/jwt_secret.txt
  auth_admin_password:
    file: ${HOST_REPO:-.}/secrets/auth_admin_password.txt
  jenkins_admin_password:
    file: ${HOST_REPO:-.}/secrets/jenkins_admin_password.txt
  sonar_admin_password:
    file: ${HOST_REPO:-.}/secrets/sonar_admin_password.txt
  sonar_jdbc_password:
    file: ${HOST_REPO:-.}/secrets/sonar_jdbc_password.txt
  e2e_user_password:
    file: ${HOST_REPO:-.}/secrets/e2e_user_password.txt
  grafana_admin_password:
    file: ${HOST_REPO:-.}/secrets/grafana_admin_password.txt
  discord_webhook_url:
    file: ${HOST_REPO:-.}/secrets/discord_webhook_url.txt
