# docker-compose.yml — orquestación (Reto 4, Etapa 1: broker)
# Levantar: cp .env.example .env && docker compose up --build
# Apagar: docker compose down   |   borrar datos: docker compose down -v
#
# Puerto de negocio al host: api-gateway :8080. empleados y departamentos usan
# expose: (visibles solo dentro de microservices-network).
# Puertos de infraestructura del broker: 5672 (AMQP) y 15672 (management UI).
# Reto 7: Jenkins en el host :9090, SonarQube en :9000. El nombre de proyecto
# queda fijo para que los volúmenes no cambien si el repo se clona en otra carpeta.

name: microservicios

services:
  # --- PostgreSQL de empleados-service (nadie más la usa) ---
  database-empleados:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${EMPLEADOS_DB_NAME}
      POSTGRES_USER: ${EMPLEADOS_DB_USER}
      POSTGRES_PASSWORD: ${EMPLEADOS_DB_PASSWORD}
    volumes:
      - vol-empleados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EMPLEADOS_DB_USER} -d ${EMPLEADOS_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  # --- MySQL de departamentos-service (motor distinto a propósito) ---
  database-departamentos:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DEPARTAMENTOS_DB_NAME}
      MYSQL_USER: ${DEPARTAMENTOS_DB_USER}
      MYSQL_PASSWORD: ${DEPARTAMENTOS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DEPARTAMENTOS_DB_ROOT_PASSWORD}
    volumes:
      - vol-departamentos:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - microservices-network

  # --- API Go. Visible solo dentro de la red (expose, no ports) ---
  departamentos-service:
    build: ./services/departamentos-service
    environment:
      PORT: 8081
      DB_HOST: database-departamentos
      DB_PORT: 3306
      DB_NAME: ${DEPARTAMENTOS_DB_NAME}
      DB_USER: ${DEPARTAMENTOS_DB_USER}
      DB_PASSWORD: ${DEPARTAMENTOS_DB_PASSWORD}
    expose:
      - "8081"
    depends_on:
      database-departamentos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  # --- API Java. Visible solo dentro de la red. Ya no espera a departamentos:
  #     el Circuit Breaker (Etapa 3) cubre esa dependencia en runtime. ---
  empleados-service:
    build: ./services/empleados-service
    environment:
      DB_HOST: database-empleados
      DB_PORT: 5432
      DB_NAME: ${EMPLEADOS_DB_NAME}
      DB_USER: ${EMPLEADOS_DB_USER}
      DB_PASSWORD: ${EMPLEADOS_DB_PASSWORD}
      DEPARTAMENTOS_SERVICE_URL: http://departamentos-service:8081
      DEPARTAMENTOS_SERVICE_TIMEOUT: ${DEPARTAMENTOS_SERVICE_TIMEOUT}
      DEPARTAMENTOS_SERVICE_MAX_ATTEMPTS: ${DEPARTAMENTOS_SERVICE_MAX_ATTEMPTS}
      DEPARTAMENTOS_SERVICE_INITIAL_BACKOFF: ${DEPARTAMENTOS_SERVICE_INITIAL_BACKOFF}
      CB_SLIDING_WINDOW_SIZE: ${CB_SLIDING_WINDOW_SIZE}
      CB_MINIMUM_NUMBER_OF_CALLS: ${CB_MINIMUM_NUMBER_OF_CALLS}
      CB_FAILURE_RATE_THRESHOLD: ${CB_FAILURE_RATE_THRESHOLD}
      CB_WAIT_DURATION_OPEN: ${CB_WAIT_DURATION_OPEN}
      CB_PERMITTED_CALLS_HALF_OPEN: ${CB_PERMITTED_CALLS_HALF_OPEN}
      BROKER_URL: amqp://message-broker:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-onboarding}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-onboarding}
      BROKER_EXCHANGE: ${BROKER_EXCHANGE:-onboarding.eventos}
    expose:
      - "8080"
    depends_on:
      database-empleados:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - microservices-network

  # --- RabbitMQ. Puertos de infraestructura, no una segunda puerta de negocio.
  #     hostname fijo: el nombre del nodo (rabbit@message-broker) vive en el
  #     volumen; si cambia, el broker no recupera las colas durables. ---
  message-broker:
    image: rabbitmq:3-management
    hostname: message-broker
    # Recupera fallos transitorios del primer arranque al inicializar el volumen/cookie de Erlang.
    restart: on-failure
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - vol-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - microservices-network

  # --- SMTP de desarrollo. No entrega correo real: lo guarda para verlo en :8025. ---
  mailhog:
    image: mailhog/mailhog
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - microservices-network

  # --- Único puerto de negocio publicado al host ---
  api-gateway:
    build: ./services/api-gateway
    environment:
      PORT: 8080
      EMPLEADOS_URL: http://empleados-service:8080
      DEPARTAMENTOS_URL: http://departamentos-service:8081
      NOTIFICACIONES_URL: http://notificaciones-service:8084
      PERFILES_URL: http://perfiles-service:8083
      VACACIONES_URL: http://vacaciones-service:8085
      AUTH_URL: http://auth-service:8086
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    # El borde debe arrancar incluso si un backend falla. Solo exige que Compose
    # haya iniciado sus contenedores; la disponibilidad se resuelve en runtime
    # con el 503 JSON del proxy y el /health del Gateway permanece independiente.
    depends_on:
      empleados-service:
        condition: service_started
      departamentos-service:
        condition: service_started
      notificaciones-service:
        condition: service_started
      perfiles-service:
        condition: service_started
      vacaciones-service:
        condition: service_started
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  # --- PostgreSQL de notificaciones-service ---
  database-notificaciones:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${NOTIFICACIONES_DB_NAME:-notificaciones_db}
      POSTGRES_USER: ${NOTIFICACIONES_DB_USER:-notificaciones}
      POSTGRES_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:-notificaciones}
    volumes:
      - vol-notificaciones:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICACIONES_DB_USER:-notificaciones} -d ${NOTIFICACIONES_DB_NAME:-notificaciones_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  # --- Consumidor Python. Solo expose: el tráfico entra por el Gateway. ---
  notificaciones-service:
    build: ./services/notificaciones-service
    environment:
      PORT: 8084
      DATABASE_URL: postgresql+psycopg://${NOTIFICACIONES_DB_USER:-notificaciones}:${NOTIFICACIONES_DB_PASSWORD:-notificaciones}@database-notificaciones:5432/${NOTIFICACIONES_DB_NAME:-notificaciones_db}
      BROKER_URL: amqp://message-broker:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-onboarding}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-onboarding}
      BROKER_EXCHANGE: ${BROKER_EXCHANGE:-onboarding.eventos}
      BROKER_QUEUE: q.notificaciones
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-onboarding@empresa.com}
    expose:
      - "8084"
    depends_on:
      database-notificaciones:
        condition: service_healthy
      message-broker:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - microservices-network

  # --- PostgreSQL de perfiles-service ---
  database-perfiles:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PERFILES_DB_NAME:-perfiles_db}
      POSTGRES_USER: ${PERFILES_DB_USER:-perfiles}
      POSTGRES_PASSWORD: ${PERFILES_DB_PASSWORD:-perfiles}
    volumes:
      - vol-perfiles:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PERFILES_DB_USER:-perfiles} -d ${PERFILES_DB_NAME:-perfiles_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  # --- Consumidor Java. Solo expose: el tráfico entra por el Gateway. ---
  perfiles-service:
    build: ./services/perfiles-service
    environment:
      PORT: 8083
      DB_HOST: database-perfiles
      DB_PORT: 5432
      DB_NAME: ${PERFILES_DB_NAME:-perfiles_db}
      DB_USER: ${PERFILES_DB_USER:-perfiles}
      DB_PASSWORD: ${PERFILES_DB_PASSWORD:-perfiles}
      BROKER_URL: amqp://message-broker:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-onboarding}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-onboarding}
      BROKER_EXCHANGE: ${BROKER_EXCHANGE:-onboarding.eventos}
      BROKER_QUEUE: q.perfiles
    expose:
      - "8083"
    depends_on:
      database-perfiles:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - microservices-network

  # --- PostgreSQL de vacaciones-service ---
  database-vacaciones:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${VACACIONES_DB_NAME:-vacaciones_db}
      POSTGRES_USER: ${VACACIONES_DB_USER:-vacaciones}
      POSTGRES_PASSWORD: ${VACACIONES_DB_PASSWORD:-vacaciones}
    volumes:
      - vol-vacaciones:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VACACIONES_DB_USER:-vacaciones} -d ${VACACIONES_DB_NAME:-vacaciones_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  # --- PostgreSQL propio de auth-service ---
  database-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
    volumes:
      - vol-auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  # --- Productor Node. Solo expose: el tráfico entra por el Gateway. ---
  vacaciones-service:
    build: ./services/vacaciones-service
    environment:
      PORT: 8085
      DATABASE_URL: postgresql://${VACACIONES_DB_USER:-vacaciones}:${VACACIONES_DB_PASSWORD:-vacaciones}@database-vacaciones:5432/${VACACIONES_DB_NAME:-vacaciones_db}
      BROKER_URL: amqp://message-broker:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-onboarding}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-onboarding}
      BROKER_EXCHANGE: ${BROKER_EXCHANGE:-onboarding.eventos}
      BROKER_QUEUE: q.vacaciones
      VACACIONES_CRON: "${VACACIONES_CRON:-* * * * *}"
    expose:
      - "8085"
    depends_on:
      database-vacaciones:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - microservices-network

  # --- Identidad y seguridad. Solo expose: el tráfico entra por el Gateway. ---
  auth-service:
    build: ./services/auth-service
    environment:
      PORT: 8086
      DATABASE_URL: postgresql+psycopg://${AUTH_DB_USER:-auth}:${AUTH_DB_PASSWORD:-auth}@database-auth:5432/${AUTH_DB_NAME:-auth_db}
      BROKER_URL: amqp://message-broker:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-onboarding}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-onboarding}
      BROKER_EXCHANGE: ${BROKER_EXCHANGE:-onboarding.eventos}
      BROKER_QUEUE: q.auth
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-60}
      RESET_TOKEN_MINUTES: ${RESET_TOKEN_MINUTES:-60}
      AUTH_ADMIN_USUARIO: ${AUTH_ADMIN_USUARIO:-admin}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-admin@empresa.com}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?Defina AUTH_ADMIN_PASSWORD en .env}
    expose:
      - "8086"
    depends_on:
      database-auth:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - microservices-network

  # --- Reto 7. Jenkins publica la UI en el host :9090; dentro de la red sigue en 8080. ---
  jenkins:
    build: ./jenkins
    container_name: jenkins
    ports:
      - "9090:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - ./jenkins/casc.yaml:/var/jenkins_home/casc_configs/casc.yaml:ro
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - sonar_bootstrap:/run/sonar-bootstrap:ro
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      DOCKER_NETWORK: microservicios_microservices-network
      SONAR_HOST_URL: ${SONAR_HOST_URL:-http://sonarqube:9000}
      ADMIN_USUARIO: ${AUTH_ADMIN_USUARIO:-admin}
      ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-Admin1234!}
      USER_PASSWORD: ${E2E_USER_PASSWORD:-Usuario123!}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - microservices-network

  # --- Reto 7. Base solo de SonarQube: no la usa ningún servicio de negocio. ---
  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_JDBC_PASSWORD:-sonar}
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservices-network

  sonarqube:
    image: sonarqube:26.10.0.133078-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_JDBC_PASSWORD:-sonar}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_VALIDATEWEBHOOKS: "false"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      sonar-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q UP"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - microservices-network

  sonar-bootstrap:
    image: alpine:3.21
    container_name: sonar-bootstrap
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_URL: http://sonarqube:9000
      SONAR_ADMIN_PASSWORD: ${SONAR_ADMIN_PASSWORD:-SonarAdmin123!}
    volumes:
      - ./jenkins/init-sonar.sh:/init-sonar.sh:ro
      - sonar_bootstrap:/bootstrap
    entrypoint: ["/bin/sh", "/init-sonar.sh"]
    restart: "no"
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  vol-empleados:
  vol-departamentos:
  vol-rabbitmq:
  vol-notificaciones:
  vol-perfiles:
  vol-vacaciones:
  vol-auth:
  jenkins_data:
    name: jenkins_data
  jenkins_m2:
    name: jenkins_m2
  jenkins_npm:
    name: jenkins_npm
  sonar_bootstrap:
    name: sonar_bootstrap
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonar_db_data:
