# docker-compose.yml — orquestación del proyecto final
# Levantar: cp .env.example .env && bash scripts/setup-secrets.sh && docker compose up --build
# Apagar: docker compose down   |   borrar datos: docker compose down -v
#
# Fase 14 (E04): el único puerto de negocio publicado es el del api-gateway (:8080). Los seis
# servicios usan solo expose:. Además publican puerto únicamente las UIs administrativas:
#   RabbitMQ UI :15672 · Mailhog :8025 · Prometheus :9090 · Grafana :3000 · Zipkin :9411
#   Jenkins :8090 · SonarQube :9000 · Registry :5001
# AMQP (5672), Loki y las bases quedan internos. El nombre de proyecto queda fijo para que los
# volúmenes no cambien si el repo se clona en otra carpeta.

name: microservicios

services:
  # --- PostgreSQL de empleados-service (nadie más la usa) ---
  database-empleados:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${EMPLEADOS_DB_NAME}
      POSTGRES_USER: ${EMPLEADOS_DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/empleados_db_password
    secrets:
      - empleados_db_password
    volumes:
      - vol-empleados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EMPLEADOS_DB_USER} -d ${EMPLEADOS_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - data-network

  # --- MySQL de departamentos-service (motor distinto a propósito) ---
  database-departamentos:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: ${DEPARTAMENTOS_DB_NAME}
      MYSQL_USER: ${DEPARTAMENTOS_DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/departamentos_db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/departamentos_db_root_password
    secrets:
      - departamentos_db_password
      - departamentos_db_root_password
    volumes:
      - vol-departamentos:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root --password=$$(cat /run/secrets/departamentos_db_root_password)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - data-network

  # --- API Go. Visible solo dentro de la red (expose, no ports) ---
  departamentos-service:
    build: ./services/departamentos-service
    environment:
      PORT: 8081
      DB_HOST: database-departamentos
      DB_PORT: 3306
      DB_NAME: ${DEPARTAMENTOS_DB_NAME}
      DB_USER: ${DEPARTAMENTOS_DB_USER}
      DB_PASSWORD_FILE: /run/secrets/departamentos_db_password
      OTEL_SERVICE_NAME: departamentos-service
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: ${OTEL_EXPORTER_ZIPKIN_ENDPOINT:-http://zipkin:9411/api/v2/spans}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext,baggage}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-always_on}
      LOG_FORMAT: json
      # Caos controlado (Reto 8, Fase 6): retardo fijo en /departamentos. 0 = desactivado.
      CHAOS_LATENCY_MS: ${DEPARTAMENTOS_CHAOS_LATENCY_MS:-0}
    expose:
      - "8081"
    secrets:
      - departamentos_db_password
    depends_on:
      database-departamentos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Fase 12: el Gateway (y Empleados) llegan aquí por Traefik vía el alias departamentos-lb, que reparte
    # entre réplicas y saca de rotación la que falle su /health (health check activo).
    labels:
      traefik.enable: "true"
      traefik.http.routers.departamentos.rule: Host(`departamentos-lb`)
      traefik.http.routers.departamentos.entrypoints: interno
      traefik.http.routers.departamentos.middlewares: reintento@file
      traefik.http.services.departamentos.loadbalancer.server.port: "8081"
      traefik.http.services.departamentos.loadbalancer.healthcheck.path: /health
      traefik.http.services.departamentos.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.departamentos.loadbalancer.healthcheck.timeout: 3s
    networks:
      - backend-network
      - data-network
      - observability-network

  # --- API Java. Visible solo dentro de la red. Ya no espera a departamentos:
  #     el Circuit Breaker (Etapa 3) cubre esa dependencia en runtime. ---
  empleados-service:
    build: ./services/empleados-service
    environment:
      DB_HOST: database-empleados
      DB_PORT: 5432
      DB_NAME: ${EMPLEADOS_DB_NAME}
      DB_USER: ${EMPLEADOS_DB_USER}
      DB_PASSWORD_FILE: /run/secrets/empleados_db_password
      DEPARTAMENTOS_SERVICE_URL: http://departamentos-lb:8000
      DEPARTAMENTOS_SERVICE_TIMEOUT: ${DEPARTAMENTOS_SERVICE_TIMEOUT}
      DEPARTAMENTOS_SERVICE_MAX_ATTEMPTS: ${DEPARTAMENTOS_SERVICE_MAX_ATTEMPTS}
      DEPARTAMENTOS_SERVICE_INITIAL_BACKOFF: ${DEPARTAMENTOS_SERVICE_INITIAL_BACKOFF}
      CB_SLIDING_WINDOW_SIZE: ${CB_SLIDING_WINDOW_SIZE}
      CB_MINIMUM_NUMBER_OF_CALLS: ${CB_MINIMUM_NUMBER_OF_CALLS}
      CB_FAILURE_RATE_THRESHOLD: ${CB_FAILURE_RATE_THRESHOLD}
      CB_WAIT_DURATION_OPEN: ${CB_WAIT_DURATION_OPEN}
      CB_PERMITTED_CALLS_HALF_OPEN: ${CB_PERMITTED_CALLS_HALF_OPEN}
      BROKER_URL: amqp://message-broker:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-onboarding}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      BROKER_EXCHANGE: ${BROKER_EXCHANGE:-onboarding.eventos}
      OTEL_SERVICE_NAME: empleados-service
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: ${OTEL_EXPORTER_ZIPKIN_ENDPOINT:-http://zipkin:9411/api/v2/spans}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext,baggage}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-always_on}
      OTEL_TRACES_EXPORTER: zipkin
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      LOG_FORMAT: json
    expose:
      - "8080"
    secrets:
      - empleados_db_password
      - rabbitmq_password
    depends_on:
      database-empleados:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    # Fase 12: el Gateway (y Empleados) llegan aquí por Traefik vía el alias empleados-lb, que reparte
    # entre réplicas y saca de rotación la que falle su /health (health check activo).
    labels:
      traefik.enable: "true"
      traefik.http.routers.empleados.rule: Host(`empleados-lb`)
      traefik.http.routers.empleados.entrypoints: interno
      traefik.http.routers.empleados.middlewares: reintento@file
      traefik.http.services.empleados.loadbalancer.server.port: "8080"
      traefik.http.services.empleados.loadbalancer.healthcheck.path: /health
      traefik.http.services.empleados.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.empleados.loadbalancer.healthcheck.timeout: 3s
    networks:
      - backend-network
      - data-network
      - messaging-network
      - observability-network

  # --- RabbitMQ. Puertos de infraestructura, no una segunda puerta de negocio.
  #     hostname fijo: el nombre del nodo (rabbit@message-broker) vive en el
  #     volumen; si cambia, el broker no recupera las colas durables. ---
  message-broker:
    build: ./infrastructure/rabbitmq
    hostname: message-broker
    # Recupera fallos transitorios del primer arranque al inicializar el volumen/cookie de Erlang.
    restart: on-failure
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_password
    secrets:
      - rabbitmq_password
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - vol-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - messaging-network

  # --- SMTP de desarrollo. No entrega correo real: lo guarda para verlo en :8025. ---
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/api/v2/messages?limit=1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - messaging-network
      - observability-network

  # --- Fase 12. Balanceador: único puerto de negocio publicado al host (:8080) ---
  # Traefik descubre por la API de Docker los contenedores de ESTE proyecto (constraint por
  # com.docker.compose.project) con traefik.enable=true y reparte entre sus réplicas sanas:
  #   web     (:8080, publicado)  → réplicas de api-gateway
  #   interno (:8000, solo backend) → servicios de negocio, por los alias <servicio>-lb
  # Health check activo contra /health de cada réplica: la que falla sale de rotación sola.
  balanceador:
    # Imagen traefik:v3.6.1 + ruta de respaldo 502 (infrastructure/traefik/dinamico.yml).
    build: ./infrastructure/traefik
    command:
      - --providers.file.filename=/etc/traefik/dinamico.yml
      - --entrypoints.web.address=:8080
      - --entrypoints.interno.address=:8000
      - --entrypoints.metricas.address=:8082
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${COMPOSE_PROJECT_NAME}_backend-network
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME}`)
      - --ping=true
      - --ping.entrypoint=metricas
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metricas
      - --metrics.prometheus.addServicesLabels=true
      - --log.format=json
      - --accesslog=false
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      # Solo lectura: Traefik lee contenedores y salud, no los modifica.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=metricas", "--entrypoints.metricas.address=:8082"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      frontend-network:
      backend-network:
        aliases:
          - empleados-lb
          - departamentos-lb
          - perfiles-lb
          - notificaciones-lb
          - vacaciones-lb
          - auth-lb
      observability-network:

  api-gateway:
    build: ./services/api-gateway
    environment:
      PORT: 8080
      EMPLEADOS_URL: http://empleados-lb:8000
      DEPARTAMENTOS_URL: http://departamentos-lb:8000
      NOTIFICACIONES_URL: http://notificaciones-lb:8000
      PERFILES_URL: http://perfiles-lb:8000
      VACACIONES_URL: http://vacaciones-lb:8000
      AUTH_URL: http://auth-lb:8000
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS}
      AUTH_PROXY_TIMEOUT_MS: ${AUTH_PROXY_TIMEOUT_MS:-5000}
      EMPLEADOS_PROXY_TIMEOUT_MS: ${EMPLEADOS_PROXY_TIMEOUT_MS:-35000}
      DEPARTAMENTOS_PROXY_TIMEOUT_MS: ${DEPARTAMENTOS_PROXY_TIMEOUT_MS:-5000}
      NOTIFICACIONES_PROXY_TIMEOUT_MS: ${NOTIFICACIONES_PROXY_TIMEOUT_MS:-5000}
      PERFILES_PROXY_TIMEOUT_MS: ${PERFILES_PROXY_TIMEOUT_MS:-5000}
      VACACIONES_PROXY_TIMEOUT_MS: ${VACACIONES_PROXY_TIMEOUT_MS:-5000}
      PROXY_RETRY_DELAYS_MS: ${PROXY_RETRY_DELAYS_MS:-1000,2000,4000}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-3}
      CB_OPEN_DURATION_MS: ${CB_OPEN_DURATION_MS:-30000}
      OTEL_SERVICE_NAME: api-gateway
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: ${OTEL_EXPORTER_ZIPKIN_ENDPOINT:-http://zipkin:9411/api/v2/spans}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext,baggage}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-always_on}
      LOG_FORMAT: json
    # Fase 12: sin puerto de host; el tráfico entra por el balanceador y escala con --scale.
    expose:
      - "8080"
    secrets:
      - jwt_secret
    # Excepción deliberada a E06 (service_healthy): el borde debe arrancar incluso si un
    # backend nunca queda sano. Solo exige que Compose haya iniciado sus contenedores; la
    # disponibilidad se resuelve en runtime con circuit breaker + 503 JSON (Fase 6) y el
    # /health del Gateway permanece independiente de los backends.
    depends_on:
      empleados-service:
        condition: service_started
      departamentos-service:
        condition: service_started
      notificaciones-service:
        condition: service_started
      perfiles-service:
        condition: service_started
      vacaciones-service:
        condition: service_started
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Fase 12: Traefik (servicio balanceador) publica el :8080 y reparte entre las réplicas
    # sanas del Gateway; el Gateway ya no publica puerto propio y escala con --scale.
    labels:
      traefik.enable: "true"
      traefik.http.routers.gateway.rule: PathPrefix(`/`)
      traefik.http.routers.gateway.entrypoints: web
      traefik.http.routers.gateway.middlewares: reintento@file
      traefik.http.services.gateway.loadbalancer.server.port: "8080"
      traefik.http.services.gateway.loadbalancer.healthcheck.path: /health
      traefik.http.services.gateway.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.gateway.loadbalancer.healthcheck.timeout: 3s
    networks:
      - backend-network
      - observability-network

  # --- PostgreSQL de notificaciones-service ---
  database-notificaciones:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${NOTIFICACIONES_DB_NAME:-notificaciones_db}
      POSTGRES_USER: ${NOTIFICACIONES_DB_USER:-notificaciones}
      POSTGRES_PASSWORD_FILE: /run/secrets/notificaciones_db_password
    secrets:
      - notificaciones_db_password
    volumes:
      - vol-notificaciones:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICACIONES_DB_USER:-notificaciones} -d ${NOTIFICACIONES_DB_NAME:-notificaciones_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - data-network

  # --- Consumidor Python. Solo expose: el tráfico entra por el Gateway. ---
  notificaciones-service:
    build: ./services/notificaciones-service
    environment:
      PORT: 8084
      DB_HOST: database-notificaciones
      DB_PORT: 5432
      DB_NAME: ${NOTIFICACIONES_DB_NAME:-notificaciones_db}
      DB_USER: ${NOTIFICACIONES_DB_USER:-notificaciones}
      DB_PASSWORD_FILE: /run/secrets/notificaciones_db_password
      BROKER_URL: amqp://message-broker:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-onboarding}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      BROKER_EXCHANGE: ${BROKER_EXCHANGE:-onboarding.eventos}
      BROKER_QUEUE: q.notificaciones
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-onboarding@empresa.com}
      NOTIFICACIONES_TEMPLATES_FILE: /app/config/templates.json
      OTEL_SERVICE_NAME: notificaciones-service
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: ${OTEL_EXPORTER_ZIPKIN_ENDPOINT:-http://zipkin:9411/api/v2/spans}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext,baggage}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-always_on}
      LOG_FORMAT: json
    volumes:
      - ./services/notificaciones-service/config/templates.json:/app/config/templates.json:ro
    secrets:
      - notificaciones_db_password
      - rabbitmq_password
    expose:
      - "8084"
    depends_on:
      database-notificaciones:
        condition: service_healthy
      message-broker:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    # Fase 12: el Gateway (y Empleados) llegan aquí por Traefik vía el alias notificaciones-lb, que reparte
    # entre réplicas y saca de rotación la que falle su /health (health check activo).
    labels:
      traefik.enable: "true"
      traefik.http.routers.notificaciones.rule: Host(`notificaciones-lb`)
      traefik.http.routers.notificaciones.entrypoints: interno
      traefik.http.routers.notificaciones.middlewares: reintento@file
      traefik.http.services.notificaciones.loadbalancer.server.port: "8084"
      traefik.http.services.notificaciones.loadbalancer.healthcheck.path: /health
      traefik.http.services.notificaciones.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.notificaciones.loadbalancer.healthcheck.timeout: 3s
    networks:
      - backend-network
      - data-network
      - messaging-network
      - observability-network

  # --- PostgreSQL de perfiles-service ---
  database-perfiles:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${PERFILES_DB_NAME:-perfiles_db}
      POSTGRES_USER: ${PERFILES_DB_USER:-perfiles}
      POSTGRES_PASSWORD_FILE: /run/secrets/perfiles_db_password
    secrets:
      - perfiles_db_password
    volumes:
      - vol-perfiles:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PERFILES_DB_USER:-perfiles} -d ${PERFILES_DB_NAME:-perfiles_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - data-network

  # --- Consumidor Java. Solo expose: el tráfico entra por el Gateway. ---
  perfiles-service:
    build: ./services/perfiles-service
    environment:
      PORT: 8083
      DB_HOST: database-perfiles
      DB_PORT: 5432
      DB_NAME: ${PERFILES_DB_NAME:-perfiles_db}
      DB_USER: ${PERFILES_DB_USER:-perfiles}
      DB_PASSWORD_FILE: /run/secrets/perfiles_db_password
      BROKER_URL: amqp://message-broker:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-onboarding}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      BROKER_EXCHANGE: ${BROKER_EXCHANGE:-onboarding.eventos}
      BROKER_QUEUE: q.perfiles
      OTEL_SERVICE_NAME: perfiles-service
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: ${OTEL_EXPORTER_ZIPKIN_ENDPOINT:-http://zipkin:9411/api/v2/spans}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext,baggage}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-always_on}
      OTEL_TRACES_EXPORTER: zipkin
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      LOG_FORMAT: json
    secrets:
      - perfiles_db_password
      - rabbitmq_password
    expose:
      - "8083"
    depends_on:
      database-perfiles:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    # Fase 12: el Gateway (y Empleados) llegan aquí por Traefik vía el alias perfiles-lb, que reparte
    # entre réplicas y saca de rotación la que falle su /health (health check activo).
    labels:
      traefik.enable: "true"
      traefik.http.routers.perfiles.rule: Host(`perfiles-lb`)
      traefik.http.routers.perfiles.entrypoints: interno
      traefik.http.routers.perfiles.middlewares: reintento@file
      traefik.http.services.perfiles.loadbalancer.server.port: "8083"
      traefik.http.services.perfiles.loadbalancer.healthcheck.path: /health
      traefik.http.services.perfiles.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.perfiles.loadbalancer.healthcheck.timeout: 3s
    networks:
      - backend-network
      - data-network
      - messaging-network
      - observability-network

  # --- PostgreSQL de vacaciones-service ---
  database-vacaciones:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${VACACIONES_DB_NAME:-vacaciones_db}
      POSTGRES_USER: ${VACACIONES_DB_USER:-vacaciones}
      POSTGRES_PASSWORD_FILE: /run/secrets/vacaciones_db_password
    secrets:
      - vacaciones_db_password
    volumes:
      - vol-vacaciones:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VACACIONES_DB_USER:-vacaciones} -d ${VACACIONES_DB_NAME:-vacaciones_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - data-network

  # --- PostgreSQL propio de auth-service ---
  database-auth:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_PASSWORD_FILE: /run/secrets/auth_db_password
    secrets:
      - auth_db_password
    volumes:
      - vol-auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - data-network

  # --- Productor Node. Solo expose: el tráfico entra por el Gateway. ---
  vacaciones-service:
    build: ./services/vacaciones-service
    environment:
      PORT: 8085
      DB_HOST: database-vacaciones
      DB_PORT: 5432
      DB_NAME: ${VACACIONES_DB_NAME:-vacaciones_db}
      DB_USER: ${VACACIONES_DB_USER:-vacaciones}
      DB_PASSWORD_FILE: /run/secrets/vacaciones_db_password
      BROKER_URL: amqp://message-broker:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-onboarding}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      BROKER_EXCHANGE: ${BROKER_EXCHANGE:-onboarding.eventos}
      BROKER_QUEUE: q.vacaciones
      VACACIONES_CRON: "${VACACIONES_CRON:-* * * * *}"
      OTEL_SERVICE_NAME: vacaciones-service
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: ${OTEL_EXPORTER_ZIPKIN_ENDPOINT:-http://zipkin:9411/api/v2/spans}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext,baggage}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-always_on}
      LOG_FORMAT: json
    secrets:
      - vacaciones_db_password
      - rabbitmq_password
    expose:
      - "8085"
    depends_on:
      database-vacaciones:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    # Fase 12: el Gateway (y Empleados) llegan aquí por Traefik vía el alias vacaciones-lb, que reparte
    # entre réplicas y saca de rotación la que falle su /health (health check activo).
    labels:
      traefik.enable: "true"
      traefik.http.routers.vacaciones.rule: Host(`vacaciones-lb`)
      traefik.http.routers.vacaciones.entrypoints: interno
      traefik.http.routers.vacaciones.middlewares: reintento@file
      traefik.http.services.vacaciones.loadbalancer.server.port: "8085"
      traefik.http.services.vacaciones.loadbalancer.healthcheck.path: /health
      traefik.http.services.vacaciones.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.vacaciones.loadbalancer.healthcheck.timeout: 3s
    networks:
      - backend-network
      - data-network
      - messaging-network
      - observability-network

  # --- Identidad y seguridad. Solo expose: el tráfico entra por el Gateway. ---
  auth-service:
    build: ./services/auth-service
    environment:
      PORT: 8086
      DB_HOST: database-auth
      DB_PORT: 5432
      DB_NAME: ${AUTH_DB_NAME:-auth_db}
      DB_USER: ${AUTH_DB_USER:-auth}
      DB_PASSWORD_FILE: /run/secrets/auth_db_password
      BROKER_URL: amqp://message-broker:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-onboarding}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      BROKER_EXCHANGE: ${BROKER_EXCHANGE:-onboarding.eventos}
      BROKER_QUEUE: q.auth
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-60}
      RESET_TOKEN_MINUTES: ${RESET_TOKEN_MINUTES:-60}
      AUTH_ADMIN_USUARIO: ${AUTH_ADMIN_USUARIO:-admin}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-admin@empresa.com}
      AUTH_ADMIN_PASSWORD_FILE: /run/secrets/auth_admin_password
      OTEL_SERVICE_NAME: auth-service
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: ${OTEL_EXPORTER_ZIPKIN_ENDPOINT:-http://zipkin:9411/api/v2/spans}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext,baggage}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-always_on}
      LOG_FORMAT: json
    expose:
      - "8086"
    secrets:
      - auth_db_password
      - rabbitmq_password
      - jwt_secret
      - auth_admin_password
    depends_on:
      database-auth:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    # Fase 12: el Gateway (y Empleados) llegan aquí por Traefik vía el alias auth-lb, que reparte
    # entre réplicas y saca de rotación la que falle su /health (health check activo).
    labels:
      traefik.enable: "true"
      traefik.http.routers.auth.rule: Host(`auth-lb`)
      traefik.http.routers.auth.entrypoints: interno
      traefik.http.routers.auth.middlewares: reintento@file
      traefik.http.services.auth.loadbalancer.server.port: "8086"
      traefik.http.services.auth.loadbalancer.healthcheck.path: /health
      traefik.http.services.auth.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.auth.loadbalancer.healthcheck.timeout: 3s
    networks:
      - backend-network
      - data-network
      - messaging-network
      - observability-network

  # --- Reto 8. Prometheus raspa los siete procesos HTTP por nombre Docker. ---
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - observability-network

  # --- Reto 8. Loki almacena logs; no publica puerto porque se consulta desde Grafana. ---
  loki:
    image: grafana/loki:3.6.11
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      # La imagen 3.6 es distroless: no incluye shell, curl ni wget.
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - observability-network

  # Promtail descubre contenedores y lee sus logs JSON mediante el socket de Docker.
  promtail:
    image: grafana/promtail:3.6.11
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/run/promtail
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      # La imagen 3.6 es distroless: se valida el binario y Promtail registra
      # errores de conexión a Loki en sus propios logs.
      test: ["CMD", "/usr/bin/promtail", "-version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - observability-network

  # Zipkin recibe spans OpenTelemetry en /api/v2/spans.
  zipkin:
    image: openzipkin/zipkin:3.5.1
    # Almacenamiento en memoria (entorno académico). Con el heap por defecto (128 MB) y el tope de
    # 500 000 spans, Zipkin murió por OutOfMemoryError tras ~40 min de tráfico + caos + BDD.
    # Se acota el número de spans (descarta los más antiguos) y se amplía el heap; si aun así cae,
    # Docker lo reinicia. Reiniciar borra las trazas: es memoria, no persistencia.
    environment:
      STORAGE_TYPE: mem
      MEM_MAX_SPANS: ${ZIPKIN_MEM_MAX_SPANS:-100000}
      JAVA_OPTS: -Xms256m -Xmx512m -XX:+ExitOnOutOfMemoryError
    restart: unless-stopped
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - observability-network

  # Grafana queda listo con Prometheus y Loki sin configuración manual en la UI.
  grafana:
    image: grafana/grafana:13.2.5
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      ZIPKIN_PORT: ${ZIPKIN_PORT:-9411}
      # Canal de alertas: email por el SMTP de desarrollo (Mailhog, ya presente desde el Reto 5).
      # Mailhog no usa TLS ni autenticación; la bandeja se ve en http://localhost:${MAILHOG_UI_PORT:-8025}.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailhog:1025
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM:-grafana-alertas@empresa.com}
      GF_SMTP_FROM_NAME: Grafana Microservicios
      GF_SMTP_STARTTLS_POLICY: NoStartTLS
      GF_SMTP_SKIP_VERIFY: "true"
      GRAFANA_ALERT_EMAIL: ${GRAFANA_ALERT_EMAIL:-equipo-observabilidad@empresa.com}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - grafana_admin_password
      # Fase 11: URL del webhook de Discord para el contact point (provisioning/alerting).
      - discord_webhook_url
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - observability-network

  # --- Reto 7 / Fase 14. Jenkins publica la UI en el host :8090 (puerto del PDF); dentro de la red
  #     sigue en 8080. Sin container_name: dos proyectos Compose no chocan por nombre global. ---
  jenkins:
    build: ./jenkins
    ports:
      - "${JENKINS_PORT:-8090}:8080"
    volumes:
      - jenkins_data:/var/jenkins_home
      - ./jenkins/casc.yaml:/var/jenkins_home/casc_configs/casc.yaml:ro
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - sonar_bootstrap:/run/sonar-bootstrap:ro
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD_FILE: /run/secrets/jenkins_admin_password
      # Fase 9: auto = la red cicd del proyecto (docker-entrypoint.sh); los agentes se unen a ella.
      DOCKER_NETWORK: auto
      JOBS_BRANCH: ${JOBS_BRANCH:-proyecto-final}
      SONAR_HOST_URL: ${SONAR_HOST_URL:-http://sonarqube:9000}
      ADMIN_USUARIO: ${AUTH_ADMIN_USUARIO:-admin}
      ADMIN_PASSWORD_FILE: /run/secrets/auth_admin_password
      USER_PASSWORD_FILE: /run/secrets/e2e_user_password
    secrets:
      - jenkins_admin_password
      - auth_admin_password
      - e2e_user_password
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # JCasC lee el token de Sonar solo al arrancar: Jenkins espera a que sonar-bootstrap lo escriba.
    depends_on:
      sonar-bootstrap:
        condition: service_completed_successfully
    networks:
      - cicd-network

  # --- Reto 7. Base solo de SonarQube: no la usa ningún servicio de negocio. ---
  sonar-db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD_FILE: /run/secrets/sonar_jdbc_password
    secrets:
      - sonar_jdbc_password
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cicd-network

  sonarqube:
    image: sonarqube:26.10.0.133078-community
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_VALIDATEWEBHOOKS: "false"
    secrets:
      - sonar_jdbc_password
    entrypoint:
      - /bin/bash
      - -c
      - export SONAR_JDBC_PASSWORD="$$(tr -d '\r\n' < /run/secrets/sonar_jdbc_password)"; exec /opt/sonarqube/docker/entrypoint.sh
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      sonar-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q UP"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - cicd-network

  sonar-bootstrap:
    build:
      context: ./jenkins
      dockerfile: sonar-bootstrap.Dockerfile
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_URL: http://sonarqube:9000
      SONAR_ADMIN_PASSWORD_FILE: /run/secrets/sonar_admin_password
    volumes:
      - sonar_bootstrap:/bootstrap
    secrets:
      - sonar_admin_password
    restart: "no"
    networks:
      - cicd-network

  # --- Fase 14/10. Registry Docker local: Jenkins publica aquí las imágenes con tag inmutable.
  #     Publicado en el host :5001 (el 5000 lo ocupa AirPlay en macOS y choca en otros equipos). ---
  registry:
    image: registry:2.8.3
    ports:
      - "${REGISTRY_PORT:-5001}:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/v2/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - cicd-network

# Fase 14 (E03/E04): seis redes del PDF. Cada contenedor entra solo en las que necesita:
#   frontend      → borde público (Gateway). Ningún servicio de negocio está aquí.
#   backend       → HTTP Gateway → servicios y Empleados → Departamentos.
#   messaging     → RabbitMQ con productores/consumidores y el SMTP de desarrollo.
#   data          → cada base con su servicio; ninguna base es alcanzable desde frontend.
#   observability → scraping de métricas, envío de trazas y logs, Grafana.
#   cicd          → Jenkins, SonarQube y Registry. No ve las bases ni el broker.
networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
  messaging-network:
    driver: bridge
  data-network:
    driver: bridge
  observability-network:
    driver: bridge
  cicd-network:
    driver: bridge

volumes:
  vol-empleados:
  vol-departamentos:
  vol-rabbitmq:
  vol-notificaciones:
  vol-perfiles:
  vol-vacaciones:
  vol-auth:
  jenkins_data:
    name: jenkins_data
  jenkins_m2:
    name: jenkins_m2
  jenkins_npm:
    name: jenkins_npm
  # Por proyecto, como sonarqube_data: el token solo vale en el SonarQube del mismo proyecto.
  sonar_bootstrap:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonar_db_data:
  registry_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:

secrets:
  empleados_db_password:
    file: ./secrets/empleados_db_password.txt
  departamentos_db_password:
    file: ./secrets/departamentos_db_password.txt
  departamentos_db_root_password:
    file: ./secrets/departamentos_db_root_password.txt
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt
  notificaciones_db_password:
    file: ./secrets/notificaciones_db_password.txt
  perfiles_db_password:
    file: ./secrets/perfiles_db_password.txt
  vacaciones_db_password:
    file: ./secrets/vacaciones_db_password.txt
  auth_db_password:
    file: ./secrets/auth_db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  auth_admin_password:
    file: ./secrets/auth_admin_password.txt
  jenkins_admin_password:
    file: ./secrets/jenkins_admin_password.txt
  sonar_admin_password:
    file: ./secrets/sonar_admin_password.txt
  sonar_jdbc_password:
    file: ./secrets/sonar_jdbc_password.txt
  e2e_user_password:
    file: ./secrets/e2e_user_password.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  discord_webhook_url:
    file: ./secrets/discord_webhook_url.txt
