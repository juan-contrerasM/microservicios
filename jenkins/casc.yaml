jenkins:
  systemMessage: "Proyecto final. Los jobs salen de este archivo; no se crean en la interfaz."
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: DOCKER_NETWORK
            value: "${DOCKER_NETWORK}"
          - key: SONAR_HOST_URL
            value: "${SONAR_HOST_URL}"
          - key: ADMIN_USUARIO
            value: "${ADMIN_USUARIO}"
          - key: ADMIN_PASSWORD
            value: "${ADMIN_PASSWORD}"
          - key: USER_PASSWORD
            value: "${USER_PASSWORD}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: sonar-token
              secret: "${SONAR_TOKEN}"
              description: "Token de SonarQube generado por sonar-bootstrap"

unclassified:
  location:
    url: "http://localhost:8090/"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "sonarqube"
        serverUrl: "${SONAR_HOST_URL}"
        credentialsId: "sonar-token"
  lockableResourcesManager:
    declaredResources:
      - name: "ecosistema-e2e"
        description: "Un solo docker compose -p micro-ci a la vez"

jobs:
  - script: |
      pipelineJob('verificar-docker') {
        description('Comprueba que el cliente Docker del contenedor habla con el daemon del host.')
        definition {
          cps {
            sandbox(true)
            script('''
              pipeline {
                agent any
                stages {
                  stage('Verificación') {
                    steps {
                      echo 'Jenkins está correctamente configurado'
                      sh 'docker --version'
                      sh 'docker compose version'
                      sh 'docker ps'
                    }
                  }
                }
              }
            ''')
          }
        }
      }
  # Fase 9 (9.JOBS): un job por servicio, sin pasos manuales. Cada Jenkinsfile se genera desde
  # jenkins/plantillas/. La rama sale de JOBS_BRANCH (docker-compose.yml); por defecto proyecto-final.
  - script: |
      ['empleados-service', 'perfiles-service', 'departamentos-service', 'auth-service',
       'notificaciones-service', 'vacaciones-service', 'api-gateway'].each { servicio ->
        pipelineJob(servicio) {
          description('CI/CD de ' + servicio + ' (Fase 9). Jenkinsfile generado desde jenkins/plantillas.')
          definition {
            cpsScm {
              scm {
                git {
                  remote {
                    url('file:///workspace')
                  }
                  branches('*/${JOBS_BRANCH:-proyecto-final}')
                }
              }
              scriptPath('services/' + servicio + '/Jenkinsfile')
            }
          }
        }
      }
