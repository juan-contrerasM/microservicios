# Solo lo usa el stage E2E (proyecto micro-ci).
# En Docker Desktop el volumen nombrado deja .erlang.cookie como root y modo 600,
# y RabbitMQ sale con eacces. En CI el broker no tiene que sobrevivir al down -v.
services:
  message-broker:
    volumes: !reset []

# down -v del proyecto micro-ci no debe borrar los volúmenes con nombre fijo
# que ya usa el compose principal.
volumes:
  jenkins_data:
    name: jenkins_data
    external: true
  jenkins_m2:
    name: jenkins_m2
    external: true
  jenkins_npm:
    name: jenkins_npm
    external: true
  jenkins_m2:
    name: jenkins_m2
    external: true
  jenkins_npm:
    name: jenkins_npm
    external: true
  sonar_bootstrap:
    name: sonar_bootstrap
    external: true
