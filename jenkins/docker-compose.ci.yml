# Solo lo usa el stage E2E (proyecto micro-ci).
# En Docker Desktop el volumen de /var/lib/rabbitmq deja .erlang.cookie como root
# y modo 600, y el broker sale con eacces. La imagen de CI trae su propio
# entrypoint y guarda la cookie en /tmp. En CI el broker no sobrevive al down -v.
services:
  message-broker:
    image: micro/rabbitmq-ci
    build:
      context: ./jenkins/rabbitmq
    user: "0:0"
    # El healthcheck del compose corre como root y no ve la cookie de /tmp.
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "env", "HOME=/tmp/rabbit-home", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes: !reset []

  # MySQL y Postgres en frío, sobre volúmenes nuevos, tardan más que el
  # start_period de desarrollo y Compose los marca unhealthy.
  database-empleados:
    healthcheck:
      start_period: 120s
      retries: 20
      timeout: 5s
  database-departamentos:
    healthcheck:
      start_period: 240s
      retries: 20
      timeout: 5s
  database-notificaciones:
    healthcheck:
      start_period: 120s
      retries: 20
      timeout: 5s
  database-perfiles:
    healthcheck:
      start_period: 120s
      retries: 20
      timeout: 5s
  database-vacaciones:
    healthcheck:
      start_period: 120s
      retries: 20
      timeout: 5s
  database-auth:
    healthcheck:
      start_period: 120s
      retries: 20
      timeout: 5s
  empleados-service:
    healthcheck:
      start_period: 120s
      retries: 20
  departamentos-service:
    healthcheck:
      start_period: 60s
      retries: 20
  notificaciones-service:
    healthcheck:
      start_period: 60s
      retries: 20
  perfiles-service:
    healthcheck:
      start_period: 150s
      retries: 20
  vacaciones-service:
    healthcheck:
      start_period: 60s
      retries: 20
  auth-service:
    healthcheck:
      start_period: 60s
      retries: 20

# down -v del proyecto micro-ci no debe borrar los volúmenes con nombre fijo
# que ya usa el compose principal.
volumes:
  jenkins_data:
    name: jenkins_data
    external: true
  jenkins_m2:
    name: jenkins_m2
    external: true
  jenkins_npm:
    name: jenkins_npm
    external: true
  sonar_bootstrap:
    name: sonar_bootstrap
    external: true
