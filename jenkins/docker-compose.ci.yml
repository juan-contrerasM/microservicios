# Solo lo usa el stage E2E (proyecto micro-ci).
# En Docker Desktop el volumen de /var/lib/rabbitmq deja .erlang.cookie como root
# y modo 600, y el broker sale con eacces. La imagen de CI trae su propio
# entrypoint y guarda la cookie en /tmp. En CI el broker no sobrevive al down -v.
services:
  message-broker:
    image: micro/rabbitmq-ci
    build:
      context: ./jenkins/rabbitmq
    user: "0:0"
    # El healthcheck del compose corre como root y no ve la cookie de /tmp.
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "env", "HOME=/tmp/rabbit-home", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 15
      # Build 8 de vacaciones: con el host cargado el broker terminó de arrancar
      # después de agotar start_period 20s + 10 reintentos, y Docker lo dejó unhealthy.
      start_period: 150s
    volumes: !reset []

  # MySQL y Postgres en frío, sobre volúmenes nuevos, tardan más que el
  # start_period de desarrollo y Compose los marca unhealthy.
  database-empleados:
    healthcheck:
      start_period: 120s
      retries: 20
      timeout: 5s
  database-departamentos:
    healthcheck:
      start_period: 240s
      retries: 20
      timeout: 5s
  database-notificaciones:
    healthcheck:
      start_period: 120s
      retries: 20
      timeout: 5s
  database-perfiles:
    healthcheck:
      start_period: 120s
      retries: 20
      timeout: 5s
  database-vacaciones:
    healthcheck:
      start_period: 120s
      retries: 20
      timeout: 5s
  database-auth:
    healthcheck:
      start_period: 120s
      retries: 20
      timeout: 5s
  empleados-service:
    healthcheck:
      # Build 8: Spring Boot tardó 287s (Jenkins + Sonar + el stack). Con
      # start_period 120s e interval 5s los 20 reintentos se agotan ~al segundo 220
      # y el contenedor queda unhealthy aunque después llegue a escuchar.
      start_period: 360s
      retries: 30
  departamentos-service:
    healthcheck:
      start_period: 60s
      retries: 20
  notificaciones-service:
    healthcheck:
      start_period: 60s
      retries: 20
    # Plantillas desde la ruta del host (ver la nota de `secrets` al final).
    volumes: !override
      - ${HOST_REPO:?defina HOST_REPO}/services/notificaciones-service/config/templates.json:/app/config/templates.json:ro
  perfiles-service:
    healthcheck:
      start_period: 150s
      retries: 20
  vacaciones-service:
    healthcheck:
      start_period: 60s
      retries: 20
  auth-service:
    healthcheck:
      start_period: 60s
      retries: 20

# down -v del proyecto micro-ci no debe borrar los volúmenes con nombre fijo
# que ya usa el compose principal.
volumes:
  jenkins_data:
    name: jenkins_data
    external: true
  jenkins_m2:
    name: jenkins_m2
    external: true
  jenkins_npm:
    name: jenkins_npm
    external: true
  sonar_bootstrap:
    name: sonar_bootstrap
    external: true

# Fase 9: Jenkins corre en un contenedor y Compose le pasa al daemon del HOST las rutas de los
# bind mounts. Las rutas relativas (./secrets, ./services/...) apuntarían al workspace de Jenkins,
# que el daemon no ve. HOST_REPO (el Source del montaje /workspace; lo calcula el Jenkinsfile) es
# la ruta real del repositorio en el host. Si falta, Compose falla en vez de montar algo vacío.
secrets:
  empleados_db_password:
    file: ${HOST_REPO:?defina HOST_REPO}/secrets/empleados_db_password.txt
  departamentos_db_password:
    file: ${HOST_REPO:?defina HOST_REPO}/secrets/departamentos_db_password.txt
  departamentos_db_root_password:
    file: ${HOST_REPO:?defina HOST_REPO}/secrets/departamentos_db_root_password.txt
  rabbitmq_password:
    file: ${HOST_REPO:?defina HOST_REPO}/secrets/rabbitmq_password.txt
  notificaciones_db_password:
    file: ${HOST_REPO:?defina HOST_REPO}/secrets/notificaciones_db_password.txt
  perfiles_db_password:
    file: ${HOST_REPO:?defina HOST_REPO}/secrets/perfiles_db_password.txt
  vacaciones_db_password:
    file: ${HOST_REPO:?defina HOST_REPO}/secrets/vacaciones_db_password.txt
  auth_db_password:
    file: ${HOST_REPO:?defina HOST_REPO}/secrets/auth_db_password.txt
  jwt_secret:
    file: ${HOST_REPO:?defina HOST_REPO}/secrets/jwt_secret.txt
  auth_admin_password:
    file: ${HOST_REPO:?defina HOST_REPO}/secrets/auth_admin_password.txt
  jenkins_admin_password:
    file: ${HOST_REPO:?defina HOST_REPO}/secrets/jenkins_admin_password.txt
  sonar_admin_password:
    file: ${HOST_REPO:?defina HOST_REPO}/secrets/sonar_admin_password.txt
  sonar_jdbc_password:
    file: ${HOST_REPO:?defina HOST_REPO}/secrets/sonar_jdbc_password.txt
  e2e_user_password:
    file: ${HOST_REPO:?defina HOST_REPO}/secrets/e2e_user_password.txt
  grafana_admin_password:
    file: ${HOST_REPO:?defina HOST_REPO}/secrets/grafana_admin_password.txt
  discord_webhook_url:
    file: ${HOST_REPO:?defina HOST_REPO}/secrets/discord_webhook_url.txt
