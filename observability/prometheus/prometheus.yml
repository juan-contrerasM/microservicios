global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Normaliza las métricas HTTP/CPU/memoria de Java, Go, Node y Python (ver rules/).
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Fase 12: descubrimiento por DNS de Docker. Con réplicas (--scale), el nombre del servicio
  # resuelve a todas y cada una es un target propio (label instance = IP:puerto), lo que permite ver
  # el reparto de tráfico. Si todas caen no hay targets: la alerta «Servicio caído» usa absent().
  - job_name: api-gateway
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api-gateway"]
        type: A
        port: 8080
        refresh_interval: 15s

  - job_name: empleados-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["empleados-service"]
        type: A
        port: 8080
        refresh_interval: 15s

  - job_name: departamentos-service
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["departamentos-service"]
        type: A
        port: 8081
        refresh_interval: 15s

  - job_name: perfiles-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["perfiles-service"]
        type: A
        port: 8083
        refresh_interval: 15s

  - job_name: notificaciones-service
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["notificaciones-service"]
        type: A
        port: 8084
        refresh_interval: 15s

  - job_name: vacaciones-service
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["vacaciones-service"]
        type: A
        port: 8085
        refresh_interval: 15s

  - job_name: auth-service
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["auth-service"]
        type: A
        port: 8086
        refresh_interval: 15s

  - job_name: balanceador
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["balanceador"]
        type: A
        port: 8082
        refresh_interval: 15s

