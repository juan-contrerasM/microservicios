# Reglas de alerta del Reto 8, aprovisionadas desde Git (sin configuración manual en la UI).
# Las consultas usan las recording rules de observability/prometheus/rules/, que normalizan
# Java, Go, Node y Python bajo el label `job` (= nombre Docker del servicio).
# Las plantillas usan .Labels / .Values en vez de $labels para que Grafana no las interprete
# como variables de entorno al leer este archivo.
apiVersion: 1

groups:
  - orgId: 1
    name: reto8-disponibilidad
    folder: Microservicios
    interval: 10s
    rules:
      - uid: reto8-servicio-caido
        title: Servicio caído
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # Fase 12: con descubrimiento DNS una réplica caída desaparece de los targets; si caen
              # todas, absent() devuelve 0 para ese job y la alerta se dispara igual.
              expr: 'min by (job) (up{job=~"api-gateway|empleados-service|departamentos-service|perfiles-service|notificaciones-service|vacaciones-service|auth-service"}) or (absent(up{job="api-gateway"}) * 0) or (absent(up{job="empleados-service"}) * 0) or (absent(up{job="departamentos-service"}) * 0) or (absent(up{job="perfiles-service"}) * 0) or (absent(up{job="notificaciones-service"}) * 0) or (absent(up{job="vacaciones-service"}) * 0) or (absent(up{job="auth-service"}) * 0)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        # Si Prometheus deja de responder también se avisa: es pérdida de visibilidad.
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          summary: '{{ .Labels.job }} no responde al scrape de Prometheus'
          description: 'Alguna réplica de {{ .Labels.job }} (o todas) lleva al menos 1 minuto sin responder al scrape (up = 0 o sin targets).'
          __dashboardUid__: reto8-observabilidad
          __panelId__: '2'
        labels:
          severity: critical
          reto: '8'
        isPaused: false

  - orgId: 1
    name: reto8-comportamiento
    folder: Microservicios
    interval: 10s
    rules:
      - uid: reto8-errores-5xx
        title: Tasa de errores 5xx superior al 10 %
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: job:http_requests_5xx:ratio_rate1m
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.1] }
        # Sin tráfico no hay tasa de error: no es una condición de alerta.
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: '{{ .Labels.job }} responde 5xx en más del 10 % de las peticiones'
          description: 'Proporción 5xx actual de {{ .Labels.job }}: {{ humanizePercentage .Values.A.Value }} (umbral 10 % durante 2 minutos).'
          __dashboardUid__: reto8-observabilidad
          __panelId__: '7'
        labels:
          severity: critical
          reto: '8'
        isPaused: false

      - uid: reto8-latencia-p95
        title: Latencia p95 superior a 2 s
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: job:http_request_duration_seconds:p95_5m
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: '{{ .Labels.job }} tiene p95 por encima de 2 segundos'
          description: 'p95 de 5 minutos de {{ .Labels.job }}: {{ humanizeDuration .Values.A.Value }}.'
          __dashboardUid__: reto8-observabilidad
          __panelId__: '6'
        labels:
          severity: warning
          reto: '8'
        isPaused: false

  # Fase 11: eventos que terminan en DLQ y memoria del proceso.
  - orgId: 1
    name: proyecto-final-eventos-recursos
    folder: Microservicios
    interval: 30s
    rules:
      - uid: pf-mensajes-dlq
        title: Mensajes enviados a una DLQ
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: job_tipo:eventos_dlq:increase5m
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        # Un mensaje en DLQ es un evento de negocio perdido hasta que alguien lo revise: sin espera.
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: '{{ .Labels.job }} envió mensajes {{ .Labels.tipo }} a su DLQ'
          description: '{{ .Values.A.Value }} mensaje(s) {{ .Labels.tipo }} terminaron en la DLQ de {{ .Labels.job }} en los últimos 5 minutos. Revisar la cola <q>.dlq en RabbitMQ.'
          __dashboardUid__: pf-negocio-eventos
          __panelId__: '20'
        labels:
          severity: warning
          fase: '11'
        isPaused: false

      - uid: pf-memoria-alta
        title: Memoria del proceso superior al 85 %
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: job:process_memory:ratio
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.85] }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: '{{ .Labels.job }} usa más del 85 % de su memoria disponible'
          description: 'Uso actual de {{ .Labels.job }}: {{ humanizePercentage .Values.A.Value }} durante 5 minutos (ver job:process_memory:ratio).'
          __dashboardUid__: reto8-observabilidad
          __panelId__: '4'
        labels:
          severity: warning
          fase: '11'
        isPaused: false
